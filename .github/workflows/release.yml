name: Release

# Runs when a maintainer pushes a version tag (v0.1.0, …). Three gates stand between a tag and users:
#   1. the build job tests and builds the signer;
#   2. the publish job waits for an approver in the "npm-release" GitHub environment;
#   3. it then only STAGES the version on npm (trusted publishing, OIDC, no token anywhere). It goes
#      live only when a package maintainer approves it on npm with their own two-factor code, so no
#      single stolen account, GitHub or npm, can release a signer.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches the version in package.json and the source
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
          npm run check-version
      - run: npm run check-hidden
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - id: hash
        run: |
          cd dist
          sha256sum geode-local-signer.mjs > SHA256SUMS
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: signer
          path: |
            dist/geode-local-signer.mjs
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # `npm stage publish` (staged publishing) needs npm 12.
      - run: npm install -g npm@12.1.0
      - uses: actions/download-artifact@v4
        with:
          name: signer
          path: dist
      - name: Stage exactly the file that was tested (a maintainer approves it on npm with 2FA)
        run: |
          echo "${{ needs.build.outputs.sha256 }}  dist/geode-local-signer.mjs" | sha256sum -c -
          npm stage publish --provenance --access public
      - name: GitHub Release with the file and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/geode-local-signer.mjs dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "sha256 of geode-local-signer.mjs is $SHA256. Staged on npm; it becomes installable once a maintainer approves it there with two-factor authentication. See CHANGELOG.md."
