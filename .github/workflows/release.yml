name: Release

# Runs when a maintainer pushes a version tag (v0.1.0, …). The build job tests and builds the signer;
# the publish job then waits for an approver in the "npm-release" environment before anything is
# published. Publishing uses npm trusted publishing (OIDC): no npm token exists anywhere.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches the version in package.json and the source
        run: |
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
          npm run check-version
      - run: npm run check-hidden
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - id: hash
        run: |
          cd dist
          sha256sum geode-local-signer.mjs > SHA256SUMS
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: signer
          path: |
            dist/geode-local-signer.mjs
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v4
        with:
          name: signer
          path: dist
      - name: Publish exactly the file that was tested
        run: |
          echo "${{ needs.build.outputs.sha256 }}  dist/geode-local-signer.mjs" | sha256sum -c -
          npm publish --provenance --access public
      - name: GitHub Release with the file and its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/geode-local-signer.mjs dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "sha256 of geode-local-signer.mjs: ${{ needs.build.outputs.sha256 }}. See CHANGELOG.md."
