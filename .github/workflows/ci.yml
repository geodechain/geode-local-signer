name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check-hidden
      - run: npm run check-version
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - name: The build is reproducible
        run: |
          first=$(sha256sum dist/geode-local-signer.mjs | cut -d' ' -f1)
          rm -rf dist && npm run build >/dev/null
          second=$(sha256sum dist/geode-local-signer.mjs | cut -d' ' -f1)
          echo "$first"; echo "$second"
          test "$first" = "$second"
